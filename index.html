
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroma Coffee Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="header">
        <img src="logo.png" alt="Aroma Logo">

        <div class="navigation">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Menu</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <div id="hero">
        <div class="content">
            <h1>Welcome to Aroma Coffee Shop</h1>
            <p>Fresh Coffee. Fresh Mood.</p>
            <button>Order Now</button>
        </div>

        <img src="coffee.jpg" alt="Coffee">
    </div>

    <div id="features">

        <div class="card">
            <h2>Espresso</h2>
        </div>

        <div class="card">
            <h2>Cappuccino</h2>
        </div>

        <div class="card">
            <h2>Latte</h2>
        </div>

        <div class="card">
            <h2>Mocha</h2>
        </div>

    </div>

    <div id="footer">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Instagram</a>
    </div>

</body>

</html>
